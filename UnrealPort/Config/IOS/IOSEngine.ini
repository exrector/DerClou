; iOS-only overrides. Kept out of DefaultEngine.ini on purpose: the desktop
; editor keeps its current look, and nothing here changes how the game is
; authored -- these are the settings that decide whether a phone survives a
; session without cooking itself.

[/Script/Engine.RendererSettings]
; Lumen, Nanite and hardware ray tracing cannot run on iOS. Leaving them
; "enabled" costs a silent fallback path rather than buying anything, so they
; are switched off explicitly for this platform.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Nanite.ProjectEnabled=False
r.Lumen.HardwareRayTracing=False
r.Lumen.TraceMeshSDFs=0

; One shadow cascade is plenty for a fixed top-down camera; each extra cascade
; is another full shadow-depth pass every frame.
r.Shadow.CSM.MaxMobileCascades=1
r.Mobile.EnableStaticAndCSMShadowReceivers=True

[SystemSettings]
; The single biggest battery lever. This is a planning game with a fixed
; camera -- nothing here needs 60 fps, and halving the frame rate roughly
; halves both GPU and CPU work.
t.MaxFPS=30

; Texture streaming budget. Without a cap the streamer will happily fill
; memory with 4K character maps that occupy a couple of hundred pixels
; on screen.
r.Streaming.PoolSize=512
r.Streaming.MaxTempMemoryAllowed=32

; Character textures capped one mip below desktop. At this camera distance the
; difference is invisible and it quarters the memory each character costs.
r.MobileContentScaleFactor=0

[/Script/Engine.Engine]
bSmoothFrameRate=True
SmoothedFrameRateRange=(LowerBound=(Type="ERangeBoundTypes::Inclusive",Value=22),UpperBound=(Type="ERangeBoundTypes::Inclusive",Value=30))
